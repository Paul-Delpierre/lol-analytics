# =====================================================================
# GitHub Actions : à chaque push (et pull request), GitHub lance ces 3 tâches
# sur une machine Linux neuve. Résultat : onglet « Actions » du dépôt, et une
# coche verte (ou une croix rouge) à côté de chaque commit.
# Aucune clé Riot ni donnée : les tests n'utilisent que de fausses parties.
# =====================================================================
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # bouton « Run workflow » pour le relancer à la main

permissions:
  contents: read              # le workflow lit le code, il ne peut rien modifier

jobs:
  # 1. Tests rapides : calcul des variables, Riot ID, fonctions du modèle (~1 min).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les paquets de l'appli et pytest
        run: pip install -r requirements-app.txt pytest -c requirements.txt
      - name: Lancer pytest
        run: python -m pytest

  # 2. Test d'intégration : vraie base PostgreSQL 16, le chemin « base » de
  #    l'entraînement comparé au chemin « JSON » de l'appli (écart attendu : 0).
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lol
          POSTGRES_PASSWORD: lol
          POSTGRES_DB: lol_test         # le test refuse une base qui ne finit pas par _test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lol -d lol_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lol:lol@localhost:5432/lol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les paquets, pytest et PyTorch (version CPU, plus légère)
        # Le dépôt de PyTorch n'a pas toutes les versions de ses dépendances (filelock...) :
        # on les prend sur PyPI aux versions de requirements.txt, puis torch seul (--no-deps).
        run: |
          pip install -r requirements-app.txt pytest filelock fsspec jinja2 networkx sympy typing_extensions setuptools -c requirements.txt
          pip install torch --no-deps -c requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Lancer le test avec base
        run: python -m pytest -m db

  # 3. L'image Docker de l'appli se construit-elle ? (même Dockerfile que sur le PC)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t lol-analytics-app .
      - name: L'appli démarre-t-elle dans le conteneur ?
        run: |
          docker run -d --name app -p 8501:8501 lol-analytics-app
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " : appli prête"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
